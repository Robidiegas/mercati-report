name: Build Mercati Report
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: MercatiReport-Windows
          - os: macos-14
            name: MercatiReport-Mac-AppleSilicon
          - os: macos-13
            name: MercatiReport-Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name MercatiReport
          --collect-all yfinance --collect-all curl_cffi --collect-data pptx
          --hidden-import openpyxl mercati_report.py
      - name: Build Mac
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name MercatiReport \
            --collect-all yfinance --collect-all curl_cffi --collect-data pptx \
            --hidden-import openpyxl mercati_report.py
          cd dist && ditto -c -k --keepParent MercatiReport.app MercatiReport.app.zip && rm -rf MercatiReport.app MercatiReport
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
